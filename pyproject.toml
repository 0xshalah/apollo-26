[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "apollo-26"
version = "0.1.0"
description = "Acoustic air-gap guidance protocol and AGC-inspired telemetry bridge"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Shalahuddin AlAyyubi" }]
dependencies = [
  "aiohttp>=3.11,<4",
  "jsonschema>=4.23,<5",
  "mcp>=1.20,<2",
  "numpy>=2.1,<3",
  "psutil>=6,<8",
  "sounddevice>=0.5,<0.6",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.120,<7",
  "mypy>=1.13,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
]

[project.scripts]
apollo26 = "acoustic.daemon:main"
apollo26-mcp = "mcp_server.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["acoustic*", "agc_core*", "mcp_server*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "slow: release-scale or physical audio tests",
  "integration: cross-component integration tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.hypothesis]
# Profiles are registered in tests/conftest.py.

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["sounddevice.*"]
ignore_missing_imports = true
